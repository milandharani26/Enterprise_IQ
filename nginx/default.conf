server {
    listen 80;
    server_name 13.126.75.93.nip.io;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 13.126.75.93.nip.io;

    # SSL Certificates generated by Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/13.126.75.93.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.126.75.93.nip.io/privkey.pem;

    # Proxy all requests to the NestJS backend
    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
